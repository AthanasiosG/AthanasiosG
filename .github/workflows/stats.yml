# Generated by scripts/generate.py. Renders the stats cards daily, no manual updates needed.
name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC
  workflow_dispatch:        # manual start: Actions tab -> "Run workflow"
  push:                     # also runs right after you change the generator
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AthanasiosG&show_icons=true&card_width=420&hide_border=true&border_radius=32&bg_color=011627&title_color=c792ea&text_color=d6deeb&icon_color=7fdbca&ring_color=c792ea
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: top-langs (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AthanasiosG&layout=compact&langs_count=6&card_width=420&hide_border=true&border_radius=32&bg_color=011627&title_color=c792ea&text_color=d6deeb
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AthanasiosG&show_icons=true&card_width=420&hide_border=true&border_radius=32&bg_color=f0f0f0&title_color=994cc3&text_color=403f53&icon_color=0c969b&ring_color=994cc3
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: top-langs (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AthanasiosG&layout=compact&langs_count=6&card_width=420&hide_border=true&border_radius=32&bg_color=f0f0f0&title_color=994cc3&text_color=403f53
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore(stats): update stats cards" || exit 0
          git push
